services:
  # ─────────────────────────────────────────
  # Node.js App (API Server)
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: homify-server:latest
    container_name: homify-app
    restart: unless-stopped
    ports:
      - '${PORT:-5000}:${PORT:-5000}'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IS_WORKER: 'false'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - homify-network

  # ─────────────────────────────────────────
  # Node.js Worker (BullMQ Background Jobs)
  # ─────────────────────────────────────────
  worker:
    image: homify-server:latest
    container_name: homify-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IS_WORKER: 'true'
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - homify-network

  # ─────────────────────────────────────────
  # Redis (BullMQ + Cache)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: homify-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homify-network

networks:
  homify-network:
    driver: bridge